function lerValor(txt) {
  let t = String(txt ?? "").trim().replace(/[R$\s]/g, "");
  if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  const n = Number(t);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
}

const Api = (() => {
  const K = CFG.pref + "sessao";
  let somenteLeitura = false;
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(K) || "null"); } catch (e) { sess = null; }
  const guardarSess = s => { sess = s; try { s ? localStorage.setItem(K, JSON.stringify(s)) : localStorage.removeItem(K); } catch (e) { /* ok */ } };
  const aPartirDe = d => guardarSess({ token: d.access_token, refresh: d.refresh_token, expira: Date.now() + (d.expires_in || 3600) * 1000, uid: (d.user && d.user.id) || (sess && sess.uid) });
  function msgErro(j, status) {
    let m = j && (j.message || j.msg || j.error_description || j.error);
    if (!m) return "Erro " + status;
    if (/row-level security|permission denied/i.test(m)) return "Você não tem permissão para esta ação.";
    if (/(column|schema cache)/i.test(m) && /(hora_prevista|hora_fim|campos|usa_financeiro|ordem|ativo)/i.test(m)) return "O banco ainda não recebeu a atualização 1. Rode o arquivo kanban_atualizacao_1.sql no Supabase.";
    if (/(servicos|motivos_parada|intervalos)/i.test(m) && /(schema cache|does not exist|relation|table)/i.test(m)) return "O banco ainda não recebeu a atualização 6. Rode o arquivo kanban_atualizacao_6.sql no Supabase.";
    if (/(produtos|produto_processos|salvar_produto)/i.test(m) && /(schema cache|does not exist|relation|table|function)/i.test(m)) return "O banco ainda não recebeu a atualização 7. Rode o arquivo kanban_atualizacao_7.sql no Supabase.";
    if (/(venda_anexos|orc_total|registrar_anexo_venda|remover_anexo_venda|salvar_condicoes_venda)/i.test(m) && /(schema cache|does not exist|relation|Could not find)/i.test(m)) return "O banco ainda não recebeu a atualização 14. Rode o arquivo kanban_atualizacao_14.sql no Supabase.";
    if (/(vendas|venda_itens|venda_cartoes|salvar_venda|mudar_fase_venda|vendas_andamento)/i.test(m) && /(schema cache|does not exist|relation|Could not find)/i.test(m)) return "O banco ainda não recebeu a atualização 12. Rode o arquivo kanban_atualizacao_12.sql no Supabase.";
    if (/duplicate key/i.test(m)) return "Já existe um registro igual.";
    if (/JWT expired|invalid JWT/i.test(m)) return "Sessão expirada. Entre de novo.";
    return m;
  }
  const qs = p => Object.entries(p || {}).filter(([, v]) => v !== undefined).map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");

  async function renovar() {
    if (!sess || !sess.refresh) { guardarSess(null); throw new Error("Sessão expirada. Entre de novo."); }
    try {
      const r = await chamar("/auth/v1/token?grant_type=refresh_token", { metodo: "POST", corpo: { refresh_token: sess.refresh }, semToken: true }, false);
      aPartirDe(r.dados);
    } catch (e) {
      if (e.status && e.status < 500) { guardarSess(null); throw new Error("Sessão expirada. Entre de novo."); }
      throw e;
    }
  }
  async function chamar(caminho, { metodo = "GET", corpo, cab = {}, semToken = false } = {}, repetir = true) {
    if (somenteLeitura && metodo !== "GET" && !/^\/auth\/v1\/(token|logout)/.test(caminho)) throw new Error("Modo Ver como: só visualização. Volte ao modo administrador para fazer alterações.");
    const h = { apikey: CFG.chave, ...cab };
    if (corpo !== undefined) h["Content-Type"] = "application/json";
    if (!semToken && sess) {
      if (sess.expira - Date.now() < 60000 && repetir) await renovar();
      if (sess) h.Authorization = "Bearer " + sess.token;
    }
    let r;
    try { r = await fetch(CFG.url + caminho, { method: metodo, headers: h, body: corpo !== undefined ? JSON.stringify(corpo) : undefined }); }
    catch (e) { throw new Error("Sem conexão com o servidor. Verifique a internet e tente de novo."); }
    if (r.status === 401 && !semToken && sess && repetir) { await renovar(); return chamar(caminho, { metodo, corpo, cab, semToken }, false); }
    const txt = await r.text();
    let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
    if (!r.ok) { const e = new Error(msgErro(j, r.status)); e.status = r.status; throw e; }
    return { dados: j };
  }
  async function binar(caminho, { metodo = "GET", corpo, tipo } = {}, repetir = true) {
    if (somenteLeitura && metodo !== "GET") throw new Error("Modo Ver como: só visualização. Volte ao modo administrador para fazer alterações.");
    if (sess && sess.expira - Date.now() < 60000 && repetir) await renovar();
    const h = { apikey: CFG.chave };
    if (sess) h.Authorization = "Bearer " + sess.token;
    if (tipo) h["Content-Type"] = tipo;
    let r;
    try { r = await fetch(CFG.url + caminho, { method: metodo, headers: h, body: corpo }); }
    catch (e) { throw new Error("Sem conexão com o servidor. Verifique a internet e tente de novo."); }
    if (r.status === 401 && sess && repetir) { await renovar(); return binar(caminho, { metodo, corpo, tipo }, false); }
    if (!r.ok) {
      let j = null; try { j = await r.json(); } catch (e) { j = null; }
      const er = new Error(r.status === 404 ? "Arquivo não encontrado no servidor." : r.status === 413 ? "Arquivo grande demais (máximo 20 MB)." : msgErro(j, r.status)); er.status = r.status; throw er;
    }
    return metodo === "GET" ? await r.blob() : null;
  }
  const ler = async (t, p) => (await chamar(`/rest/v1/${t}?${qs(p)}`)).dados || [];
  async function listar(t, p) {
    let tudo = [], desde = 0;
    for (;;) {
      const pag = (await chamar(`/rest/v1/${t}?${qs({ ...p, limit: 1000, offset: desde })}`)).dados || [];
      tudo = tudo.concat(pag);
      if (pag.length < 1000) break;
      desde += 1000;
    }
    return tudo;
  }
  return {
    get logado() { return !!sess; },
    get uid() { return sess && sess.uid; },
    set somenteLeitura(v) { somenteLeitura = !!v; },
    ler, listar, bin: binar,
    inserir: async (t, corpo, query, prefer = "return=representation") => (await chamar(`/rest/v1/${t}${query ? "?" + qs(query) : ""}`, { metodo: "POST", corpo, cab: { Prefer: prefer } })).dados,
    alterar: async (t, filtros, corpo) => (await chamar(`/rest/v1/${t}?${qs(filtros)}`, { metodo: "PATCH", corpo, cab: { Prefer: "return=representation" } })).dados || [],
    apagar: async (t, filtros) => (await chamar(`/rest/v1/${t}?${qs(filtros)}`, { metodo: "DELETE", cab: { Prefer: "return=representation" } })).dados || [],
    rpc: async (nome, args) => (await chamar(`/rest/v1/rpc/${nome}`, { metodo: "POST", corpo: args || {} })).dados,
    async entrar(usuario, senha) {
      const email = String(usuario).trim().toLowerCase() + "@" + CFG.dominio;
      try { aPartirDe((await chamar("/auth/v1/token?grant_type=password", { metodo: "POST", corpo: { email, password: senha }, semToken: true }, false)).dados); }
      catch (e) { if (e.status && e.status >= 400 && e.status < 500) throw new Error("Usuário ou senha incorretos."); throw e; }
    },
    async sair() { try { if (sess) await chamar("/auth/v1/logout", { metodo: "POST" }, false); } catch (e) { /* sai mesmo assim */ } guardarSess(null); },
    limpar() { guardarSess(null); },
    trocarSenha: senha => chamar("/auth/v1/user", { metodo: "PUT", corpo: { password: senha } }),
    funcao: async (nome, corpo) => (await chamar("/functions/v1/" + nome, { metodo: "POST", corpo })).dados
  };
})();

function aplicarQuadro(d) {

  const mapa = (arr, a, b) => { const m = new Map(); arr.forEach(r => { if (!m.has(r[a])) m.set(r[a], []); m.get(r[a]).push(r[b]); }); return m; };
  const ativas = new Set(S.quadros.map(q => q.id));

/* ===================== FILTROS ===================== */
function passa(c, f, hoje) {
  if (!f.arquivados && c.arquivado) return false;
  if (f.status === "abertos" && c.status === "concluido") return false;
  if (f.status === "concluidos" && c.status !== "concluido") return false;
  if (f.tipo && (areaDe(c.quadro_id) || {}).usa_financeiro && c.tipo !== f.tipo) return false;
  if (f.categoria === "__sem") { if (c.categoria_id) return false; }
  else if (f.categoria && categoriasArea(c.quadro_id).some(x => x.id === f.categoria) && c.categoria_id !== f.categoria) return false;
  if (f.resp && !(S.resp.get(c.id) || []).includes(f.resp === "__eu" ? uidEf() : f.resp)) return false;
  if (f.busca && !((c.titulo + " " + (c.empresa || "")).toLowerCase().includes(f.busca.toLowerCase()))) return false;
  const d = c[f.campo];
  switch (f.periodo) {
    case "hoje": return d === hoje;
    case "semana": return !!d && d >= inicioSemana(hoje) && d <= fimSemana(hoje);
    case "mes": return !!d && d >= inicioMes(hoje) && d <= fimMes(hoje);
    case "atrasados": return ehAtrasado(c, hoje);
    case "semdata": return !d;
    case "periodo": return !!d && (!f.de || d >= f.de) && (!f.ate || d <= f.ate);
    default: return true;
  }
}
function contadores(f, hoje) {
  const ab = cartoesArea().filter(c => !c.arquivado && c.status !== "concluido");
  return {
    atrasados: ab.filter(c => ehAtrasado(c, hoje)).length,
    hoje: ab.filter(c => c[f.campo] === hoje).length,
    semana: ab.filter(c => c[f.campo] && c[f.campo] >= inicioSemana(hoje) && c[f.campo] <= fimSemana(hoje)).length,
    semdata: ab.filter(c => !c[f.campo]).length
  };
}
const porData = campo => (a, b) => {
  const x = a[campo] || "9999-99-99", y = b[campo] || "9999-99-99";
  return x < y ? -1 : x > y ? 1 : a.titulo.localeCompare(b.titulo, "pt-BR");
};
function somas(lista) {
  let p = 0, r = 0;
  lista.forEach(c => { if (c.valor == null) return; if (c.tipo === "receber") r += cent(c.valor); else if (c.tipo !== "tarefa") p += cent(c.valor); });
  return { pagar: p / 100, receber: r / 100 };
}
function relativo(c, hoje) {
  if (c.status === "concluido" || !c.data_prevista) return "";
  const d = diasEntre(hoje, c.data_prevista);
  if (d < 0) return `atrasado há ${-d} ${d === -1 ? "dia" : "dias"}`;
  if (d === 0) return "vence hoje";
  if (d === 1) return "vence amanhã";
  return `faltam ${d} dias`;
}

}
function cfMover(i, d) { const j = i + d; if (j < 0 || j >= CE.lista.length) return; [CE.lista[i], CE.lista[j]] = [CE.lista[j], CE.lista[i]]; desenharCampos(); }
async function salvarCampos() {
  const usados = new Set(CE.lista.filter(d => d.id).map(d => d.id));
  const saida = [];
  for (const d of CE.lista) {
    const nome = String(d.nome || "").trim();

      item.opcoes = ops;

    saida.push(item);
  }
  try {
    const r = await Api.alterar("quadros", { id: "eq." + CE.qid }, { campos: saida });

function gerarSenha(n = 10) {

}

async function copiarTexto(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove(); return ok;
  }
}

    abrir2(`<h2>Mover ${esc(pl(ids.length, "cartão", "cartões"))} para outra área</h2>
      <div class="field"><label for="ml-area">Área de destino</label><select id="ml-area">${alvos.map(q => `<option value="${esc(q.id)}">${esc(q.nome)}</option>`).join("")}</select></div>

  if (semAcesso.size && !(await confirmar(`${[...semAcesso].map(nomeDe).join(", ")} ${semAcesso.size === 1 ? "é responsável por cartões que vão para" : "são responsáveis por cartões que vão para"} uma área a que não ${semAcesso.size === 1 ? "tem" : "têm"} acesso, e não ${semAcesso.size === 1 ? "verá" : "verão"} esses cartões. Mover mesmo assim?`, "Mover", false))) return;
  try {

async function importarAgora() {

    if (cats.length) await Api.inserir("categorias", cats, { on_conflict: "quadro_id,nome" }, "resolution=ignore-duplicates,return=minimal");
    const etqs = (d.etiquetas || []).map(e => ({ quadro_id: quadroFin, cor: e.cor, nome: e.nome }));
    if (etqs.length) await Api.inserir("etiquetas", etqs, { on_conflict: "quadro_id,cor" }, "resolution=ignore-duplicates,return=minimal");
    const catRows = await Api.ler("categorias", { select: "id,nome,quadro_id" });
    const catPorNome = new Map(catRows.map(c => [c.nome, c.id]));
    const etqRows = await Api.ler("etiquetas", { select: "id,cor", quadro_id: "eq." + quadroFin });
    const etqPorCor = new Map(etqRows.map(e => [e.cor, e.id]));
    const linhas = linhasImportacao(d, { quadroFin, quadroDoc, catPorNome });
    let novos = 0, ignorados = 0;
    for (let i = 0; i < linhas.length; i += 40) {

      const corpo = lote.map(l => { const { _extra, ...r } = l; return r; });
      const ret = await Api.inserir("cartoes", corpo, { on_conflict: "id_externo", select: "id,id_externo" }, "resolution=ignore-duplicates,return=representation");
      const idPor = new Map((ret || []).map(r => [r.id_externo, r.id]));
      novos += idPor.size; ignorados += lote.length - idPor.size;
      const hist = [], resp = [], etq = [];
      lote.forEach(l => {
        const id = idPor.get(l.id_externo); if (!id) return;
        if (l._extra.data_prevista) hist.push({ cartao_id: id, campo: "data_prevista", data_anterior: null, data_nova: l._extra.data_prevista, motivo: "Importado do Trello", origem: "importacao", alterado_por: Api.uid });
        if (l._extra.data_inicio) hist.push({ cartao_id: id, campo: "data_inicio", data_anterior: null, data_nova: l._extra.data_inicio, motivo: "Importado do Trello", origem: "importacao", alterado_por: Api.uid });
        l._extra.responsaveis.forEach(u => resp.push({ cartao_id: id, usuario_id: u }));
        l._extra.etiquetas.forEach(cor => { if (etqPorCor.has(cor)) etq.push({ cartao_id: id, etiqueta_id: etqPorCor.get(cor) }); });
      });
      if (hist.length) await Api.inserir("historico_datas", hist, null, "return=minimal");
      if (resp.length) await Api.inserir("cartao_responsaveis", resp, null, "return=minimal");
      if (etq.length) await Api.inserir("cartao_etiquetas", etq, null, "return=minimal");
      log(`${Math.min(i + 40, linhas.length)} de ${linhas.length} processados...`);
    }
    log(`Pronto: ${novos} cartões novos, ${ignorados} já existiam e foram mantidos.`);
    await carregarQuadro();
    aviso("Importação concluída.");
  } catch (e) { log("PAROU COM ERRO: " + e.message + "\nCorrija e rode de novo: o que já entrou não duplica."); erro(e); }
  if (btn) btn.disabled = false;
}

async function baixarBackup() {
  const btn = $("#bt-backup"), msg = $("#bk-msg");
  if (btn) btn.disabled = true;
  try {
    const tabelas = [["profiles", "id.asc"], ["quadros", "id.asc"], ["quadro_membros", "quadro_id.asc,usuario_id.asc"], ["categorias", "id.asc"], ["etiquetas", "id.asc"], ["cartoes", "id.asc"], ["cartao_responsaveis", "cartao_id.asc,usuario_id.asc"], ["cartao_etiquetas", "cartao_id.asc,etiqueta_id.asc"], ["comentarios", "id.asc"], ["historico_datas", "id.asc"], ["atividades", "id.asc"]];
    const saida = { tipo: "backup-kanban-fin", versao: 1, gerado_em: new Date().toISOString(), tabelas: {} };
    for (const [t, ord] of tabelas) { if (msg) msg.textContent = `Lendo ${t}...`; saida.tabelas[t] = await Api.listar(t, { select: "*", order: ord }); }
    const blob = new Blob([JSON.stringify(saida)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `kanban-backup-${hojeBR()}.json`;
    document.body.appendChild(a); a.click(); a.remove();

  } catch (e) { erro(e); if (msg) msg.textContent = ""; }

}

async function moverCartao(id, status) {
  const c = cartaoLocal(id); if (!c) return;
  const paraArq = status === "arquivado";
  if (paraArq ? c.arquivado : (c.status === status && !c.arquivado)) return;
  if (!podeEditar(c.quadro_id)) { aviso("Você só pode ler esta área.", "erro"); return; }
  if (paraArq && !(await confirmar(`Arquivar "${c.titulo}"? Ele sai das colunas e fica só em Arquivados.`, "Arquivar", false))) return;
  try {
    const corpo = paraArq ? { arquivado: true } : (c.arquivado ? { arquivado: false, status } : { status });
    const r = await Api.alterar("cartoes", { id: "eq." + id, versao: "eq." + c.versao }, corpo);
    if (!r.length) { aviso("Outro usuário alterou este cartão. Atualizei a tela, tente de novo.", "erro"); await carregarQuadro(); }
    else { mesclar(r[0]); aviso(paraArq ? "Cartão arquivado." : c.arquivado ? `Desarquivado e movido para "${STATUS[status]}".` : `Movido para "${STATUS[status]}".`); }
    render();
  } catch (e) { erro(e); }
}

async function acaoLote(acao) {
  const ids = [...FC.sel]; if (!ids.length) return;

    if (acao === "lote-conferido") { await emLote(ids, { conferido: true }, `${pl(ids.length, "cartão marcado", "cartões marcados")} como conferido${ids.length === 1 ? "" : "s"}.`); }

    else if (acao === "lote-mover") { await moverLote(ids); }
    else if (acao === "lote-desarquivar") { await emLote(ids, { arquivado: false }, "Cartões desarquivados."); }
    else if (acao === "lote-concluir") {
      const d = await pedirTexto(`Marcar ${pl(ids.length, "cartão", "cartões")} como concluído${ids.length === 1 ? "" : "s"}`, "Data de conclusão (deixe vazio para usar hoje)", "Concluir cartões", "date");
      if (d === null) return;
      await emLote(ids, d ? { status: "concluido", data_conclusao: d } : { status: "concluido" }, "Cartões concluídos.");
    } else if (acao === "lote-lixeira") {
      if (!(await confirmar(`Enviar ${pl(ids.length, "cartão", "cartões")} para a lixeira? Você pode restaurá-los depois.`, "Enviar para a lixeira"))) return;
      await emLote(ids, { excluido_em: new Date().toISOString() }, "Cartões enviados para a lixeira.");

  } catch (e) { erro(e); }

/* ===== arrastar cartões: mouse (arrastar) e celular (segurar e arrastar) ===== */
const Drag = { mouse: false, timer: null, ativo: false, id: null, ghost: null, alvo: null, x0: 0, y0: 0, x: 0, y: 0, dx: 0, dy: 0, raf: null, bloqueiaClique: 0 };
const STATUS_BARRA = ["a_fazer", "em_andamento", "concluido"];
const alvoSob = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest(".kcol, .dropbtn") : null; };
function marcarAlvo(el) {
  if (Drag.alvo === el) return;
  if (Drag.alvo) Drag.alvo.classList.remove("sobre");
  Drag.alvo = el; if (el) el.classList.add("sobre");
}
function iniciarArraste(card, x, y) {
  Drag.ativo = true; Drag.id = card.dataset.id;
  const r = card.getBoundingClientRect();
  const g = card.cloneNode(true);
  g.classList.add("ghost"); g.removeAttribute("draggable"); g.style.width = r.width + "px";
  Drag.dx = x - r.left; Drag.dy = y - r.top;
  document.body.appendChild(g); Drag.ghost = g;
  card.classList.add("arrastando");
  const barra = document.createElement("div");
  barra.className = "dropbar"; barra.id = "dropbar"; barra.setAttribute("aria-hidden", "true");
  barra.innerHTML = [...STATUS_BARRA, ...(document.querySelector(".kcol-arq") ? ["arquivado"] : [])].map(s => `<div class="dropbtn" data-status="${s}">${s === "arquivado" ? "Arquivados" : STATUS[s]}</div>`).join("");
  document.body.appendChild(barra);
  document.body.classList.add("arrastando-cartao");
  if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) { /* sem vibração */ } }
  moverArraste(x, y);
  Drag.raf = requestAnimationFrame(rolagemAuto);
}
function moverArraste(x, y) {
  Drag.x = x; Drag.y = y;
  Drag.ghost.style.transform = `translate(${x - Drag.dx}px, ${y - Drag.dy}px) rotate(2deg)`;
  marcarAlvo(alvoSob(x, y));
}
function rolagemAuto() {
  if (!Drag.ativo) return;
  const k = $(".kanban");
  if (k) { const r = k.getBoundingClientRect(); if (Drag.x < r.left + 48) k.scrollLeft -= 14; else if (Drag.x > r.right - 48) k.scrollLeft += 14; }
  if (Drag.y < 70) window.scrollBy(0, -14);
  Drag.raf = requestAnimationFrame(rolagemAuto);
}
function encerrarArraste(soltou) {
  clearTimeout(Drag.timer); Drag.timer = null;
  if (!Drag.ativo) return;
  cancelAnimationFrame(Drag.raf);
  const st = soltou && Drag.alvo ? Drag.alvo.dataset.status : null, id = Drag.id;
  if (Drag.ghost) Drag.ghost.remove();
  const bar = $("#dropbar"); if (bar) bar.remove();
  $$(".arrastando").forEach(x => x.classList.remove("arrastando"));
  if (Drag.alvo) Drag.alvo.classList.remove("sobre");
  document.body.classList.remove("arrastando-cartao");
  Object.assign(Drag, { ativo: false, id: null, ghost: null, alvo: null, bloqueiaClique: Date.now() + 450 });
  if (st) moverCartao(id, st);
}

function verificarCartaoAberto() {

  if (el) el.outerHTML = html; else { const b = $("#f-cartao .barra-cartao"); if (b) b.insertAdjacentHTML("afterend", html); }

async function sincronizar(motivo) {
  if (!S.eu || !Api.logado || Sync.emCurso) return;
  if (document.hidden && motivo !== "volta") return;
  if (motivo === "tempo" && Date.now() - Sync.ultimaAcao > CFG.ociosoApos) return;
  if (motivo !== "tempo" && Date.now() - Sync.ultimaTentativa < 3000) return;
  Sync.emCurso = true; Sync.ultimaTentativa = Date.now();
  const g = S.gen;
  try {
    const d = await buscarQuadro();
    if (g !== S.gen || !S.eu) Sync.repetir = true;   // uma ação local mexeu nos dados durante a busca: descarta esta leitura
    else {
      const mudou = (d.vazio ? "" : assinatura(d)) !== S.assin;
      aplicarQuadro(d);
      Sync.falhas = 0;
      if (Sync.avisouFalha) { Sync.avisouFalha = false; aviso("Conexão restabelecida. Tela atualizada."); }
      if (mudou) { verificarCartaoAberto(); pedirRender(); }
    }
  } catch (e) {
    Sync.falhas++;
    if (/Sessão expirada/.test(e.message)) erro(e);
    else if (Sync.falhas >= 3 && !Sync.avisouFalha) { Sync.avisouFalha = true; aviso("Não consigo atualizar a tela automaticamente. Verifique a internet: o que aparece pode estar desatualizado.", "erro"); }
  } finally { Sync.emCurso = false; atualizarRotulo(); }
  if (Sync.repetir) { Sync.repetir = false; setTimeout(() => sincronizar("volta"), 1500); }
}

["pointerdown", "pointermove", "keydown", "change", "input", "wheel", "scroll", "touchstart"].forEach(ev => document.addEventListener(ev, () => {

const paraMin = t => { const [h, m] = String(t).slice(0, 5).split(":").map(Number); return h * 60 + m; };

      } else if (cd === "mot-ativo") {
        if (!t.checked && !(await confirmar(`Desativar "${m.nome}"? Ele deixa de aparecer na lista de pausas. O que já foi registrado continua guardado.`, "Desativar"))) { render(); return; }
        await salvarCadastro("motivos_parada", CAD.motivos, id, "ativo", t.checked); aviso("Motivo atualizado."); render();
      }
    } else if (cd.startsWith("int-")) {
      const i = CAD.intervalos.find(x => x.id === id); if (!i) return;
      if (cd === "int-nome") {
        const n = t.value.trim();
        if (n.length < 2) { aviso("O nome do intervalo não pode ficar vazio.", "erro"); render(); return; }
        if (CAD.intervalos.some(x => x.id !== id && mesmoNome(x.nome, n))) { aviso("Já existe um intervalo com esse nome.", "erro"); render(); return; }
        if (n === i.nome) return;
        await salvarCadastro("intervalos", CAD.intervalos, id, "nome", n); aviso("Intervalo atualizado.");
      } else if (cd === "int-inicio" || cd === "int-fim") {
        const ini = cd === "int-inicio" ? t.value : hhmm(i.inicio), fim = cd === "int-fim" ? t.value : hhmm(i.fim);
        if (!ini || !fim) { aviso("Informe o horário.", "erro"); render(); return; }
        if (paraMin(fim) <= paraMin(ini)) { aviso("O fim precisa ser depois do início.", "erro"); render(); return; }
        const c = i.ativo ? conflitoIntervalo(ini, fim, id) : ""; if (c) { aviso(c, "erro"); render(); return; }
        await salvarCadastro("intervalos", CAD.intervalos, id, cd === "int-inicio" ? "inicio" : "fim", t.value); aviso("Intervalo atualizado."); render();
      } else if (cd === "int-ativo") {
        if (t.checked) { const c = conflitoIntervalo(hhmm(i.inicio), hhmm(i.fim), id); if (c) { aviso(c, "erro"); render(); return; } }
        else if (!(await confirmar(`Desativar "${i.nome}"? Esse horário volta a contar como tempo de produção.`, "Desativar"))) { render(); return; }
        await salvarCadastro("intervalos", CAD.intervalos, id, "ativo", t.checked); aviso("Intervalo atualizado."); render();
      }
    }
  } catch (e) { erro(e); render(); }
});

async function lerPdfEPreencher(file, sobrescrever) {

  msg.textContent = `Lendo ${file.name}…`;
  let r, itensPdf = [];
  try {
    const linhas = await linhasDoPdf(file);
    if (!linhas.length) { msg.textContent = "Este PDF não tem texto (é imagem escaneada). Digite o valor e as condições."; return; }
    r = extrairCondicoes(linhas);
    try { itensPdf = extrairItens(linhas); } catch (e2) { itensPdf = []; }
  } catch (e) { msg.textContent = "Não consegui ler o PDF: " + (e && e.message ? e.message : "arquivo inválido") + ". Digite o valor e as condições."; return; }
  if (!$("#vd-c-total")) return;
  const achou = [], faltou = [];
  CAMPOS_COND.forEach(([id, k, rot]) => {
    const el = $("#" + id);
    if (r[k] == null) { if (k !== "cliente") faltou.push(rot); return; }
    if (k === "cliente") { if (el && !el.disabled && !el.value.trim()) { el.value = r.cliente; VE.sujo = true; achou.push("cliente: " + r.cliente); } return; }
    const txt = (k === "total" || k === "entrada") ? valorTxt(r[k]) : String(r[k]);
    if (el.value.trim() && !sobrescrever) { if (el.value.trim() !== txt) achou.push(`${rot}: o PDF diz ${(k === "total" || k === "entrada") ? brl(r[k]) : txt} (mantive o que já estava)`); return; }
    el.value = txt; achou.push(`${rot}: ${(k === "total" || k === "entrada") ? brl(r[k]) : txt}`);
  });
  VE.condSuja = true;
  msg.innerHTML = achou.length ? `<b>Lido do PDF — confira antes de salvar:</b> ${esc(achou.join(" · "))}.${r.total_somado ? " O PDF não traz o valor total: somei o total de cada item." : ""}${faltou.length ? ` Não encontrei: ${esc(faltou.join(", "))}.` : ""}` : "Não encontrei valor nem condições neste PDF. Digite nos campos.";
  atualizarComparaItens();
  VE.itensPdf = itensPdf.length ? { arquivo: file.name, itens: itensPdf } : null;
  mostrarOfertaItens();
  if (!itensPdf.length && !VE.leitura) msg.innerHTML += " Não encontrei a lista de itens neste PDF (digite os itens abaixo).";
}
function ofertaItensHtml() {
  const o = VE && VE.itensPdf; if (!o || VE.leitura) return "";
  const soma = Math.round(o.itens.reduce((t, i) => t + (i.valor_unitario || 0) * i.quantidade, 0) * 100) / 100;
  const semVal = o.itens.filter(i => i.valor_unitario === null).length;
  return `<div class="vd-escolhido" style="display:block;margin-bottom:.5rem"><b>${pl(o.itens.length, "item encontrado", "itens encontrados")} em ${esc(o.arquivo)}</b>${soma ? ` <span class="muted">— soma ${esc(brl(soma))}${semVal ? ` (${pl(semVal, "item sem valor", "itens sem valor")})` : ""}</span>` : ""}
    <details style="margin:.4rem 0"><summary class="muted">Ver os itens lidos</summary><ol class="vd-itens" style="margin-top:.4rem">${o.itens.map((i, k) => `<li><span style="flex:1;min-width:0"><b>${k + 1}. ${esc(i.nome)}</b><span class="muted" style="display:block;font-size:.85rem">${esc(medidasTxt(i))} · ${esc(valorItemTxt(i))}</span></span></li>`).join("")}</ol></details>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="primary small" data-acao="vd-itens-importar">Importar ${pl(o.itens.length, "item", "itens")} (sem ficha)</button><button type="button" class="small" data-acao="vd-itens-descartar">Não importar</button></div>
    <div class="muted" style="font-size:.85rem;margin-top:.3rem">Os itens entram sem produto do cadastro (“sem ficha”), com nome, medidas, vidro, cor, valor e descrição do PDF. Depois, em cada item, use Escolher produto. Confira as medidas: o PDF mostra o tamanho do vão.</div></div>`;
}
function mostrarOfertaItens() { const el = $("#vd-anx-itens"); if (el) el.innerHTML = ofertaItensHtml(); }
async function importarItensPdf() {
  const o = VE.itensPdf, msg = $("#vd-anx-msg"); if (!o || !o.itens.length || VE.leitura) return;
  if (editorTemConteudo()) { if (msg) msg.textContent = "Inclua ou limpe o item que está no editor antes de importar."; return; }
  if (VE.itens.length + o.itens.length > 300) { if (msg) msg.textContent = "Passaria de 300 itens. Importe menos itens ou tire alguns."; return; }
  const ja = VE.itens.length, rep = VE.importados.includes(o.arquivo);
  const txt = (ja ? `Já há ${pl(ja, "item", "itens")} aqui. Acrescentar os ${o.itens.length} de “${o.arquivo}” depois deles?` : `Importar os ${pl(o.itens.length, "item", "itens")} de “${o.arquivo}”?`) + ` Eles entram como “sem ficha”.` + (rep ? " Atenção: este arquivo já foi importado nesta tela; os itens ficariam repetidos." : "");
  if (!(await confirmar(txt, "Importar itens", false))) return;
  o.itens.forEach(i => VE.itens.push({ ...ITEM_VAZIO, produto_nome: i.nome, nome_orcamento: i.nome, quantidade: i.quantidade, largura: i.largura ?? "", altura: i.altura ?? "", vidro: i.vidro, cor: i.cor, observacao: i.observacao, valor_unitario: i.valor_unitario, valor_txt: "" }));
  VE.importados.push(o.arquivo); VE.itensPdf = null; VE.sujo = true;
  redesenharEditor(); mostrarOfertaItens(); atualizarComparaItens();
  aviso(`${pl(o.itens.length, "item importado", "itens importados")}. Eles estão “sem ficha”; salve para guardar.`);
}
async function lerItensDoAnexo(id) {
  const a = VD.anexos.find(x => x.id === id), msg = $("#vd-anx-msg"); if (!a || !msg) return;
  msg.textContent = `Baixando ${a.nome}…`;
  try {
    const blob = await Api.bin(`/storage/v1/object/authenticated/vendas-anexos/${caminhoStorage(a.caminho)}`);
    await lerPdfEPreencher(new File([blob], a.nome, { type: a.tipo_mime || "application/pdf" }), false);
  } catch (e) { msg.textContent = "Não consegui ler o arquivo: " + msgVenda(e); }
}
function lerCondicoes() {
  const v = id => ($("#" + id) ? $("#" + id).value.trim() : "");
  const total = lerValor(v("vd-c-total")), entrada = lerValor(v("vd-c-entrada"));
  return { num: v("vd-c-num"), total, entrada, pag: v("vd-c-pag"), prazo: v("vd-c-prazo"), val: v("vd-c-val"), obs: v("vd-c-obs") };
}
function validarCondicoes() {
  if (!$("#vd-c-total")) return "";
  const c = lerCondicoes();
  if (Number.isNaN(c.total) || (c.total !== null && c.total > 9999999999.99)) { $("#vd-c-total").focus(); return "Valor total do orçamento inválido. Use o formato 1.234,56 (ou deixe em branco)."; }
  if (Number.isNaN(c.entrada) || (c.entrada !== null && c.entrada > 9999999999.99)) { $("#vd-c-entrada").focus(); return "Entrada inválida. Use o formato 1.234,56 (ou deixe em branco)."; }
  return "";
}
function atualizarComparaItens() {
  const el = $("#vd-c-compara"); if (!el) return;
  const t = totalItens(VE.itens), c = lerValor(($("#vd-c-total") || {}).value);
  el.textContent = t.algum && c !== null && !Number.isNaN(c) && Math.abs(c - t.total) > 0.005 ? `A soma dos itens digitados é ${brl(t.total)}; o valor total do orçamento é ${brl(c)}. No Financeiro vale o valor total do orçamento.` : "";
}
function listaAnexosHtml(v) {
  const ed = anxEditavel(v), ex = anexosDaVenda(v ? v.id : null);
  const lin = [];
  ex.forEach(a => lin.push(`<li><span style="flex:1;min-width:0;overflow-wrap:anywhere"><b>${esc(a.nome)}</b><span class="muted" style="display:block;font-size:.85rem">${esc(tamanhoTxt(a.bytes))} · ${esc(horaBR(a.criado_em))} · ${esc(String(nomeDe(a.criado_por)).split(" ")[0])}</span></span><span class="vd-bts"><button type="button" class="small" data-acao="vd-anx-abrir" data-id="${esc(a.id)}">Abrir</button>${!VE.leitura && extDe(a.nome) === "pdf" ? `<button type="button" class="small" data-acao="vd-anx-itens" data-id="${esc(a.id)}" title="Lê a lista de itens deste PDF para você importar">Ler itens</button>` : ""}${ed ? `<button type="button" class="small danger" data-acao="vd-anx-tirar" data-id="${esc(a.id)}">Tirar</button>` : ""}</span></li>`));
  (VE.pend || []).forEach((f, i) => lin.push(`<li><span style="flex:1;min-width:0;overflow-wrap:anywhere"><b>${esc(f.name)}</b><span class="muted" style="display:block;font-size:.85rem">${esc(tamanhoTxt(f.size))} · será enviado ao salvar</span></span><span class="vd-bts">${extDe(f.name) === "pdf" ? `<button type="button" class="small" data-acao="vd-pend-ler" data-i="${i}" title="Lê o PDF de novo e troca o que está nos campos">Ler de novo</button>` : ""}<button type="button" class="small danger" data-acao="vd-pend-tirar" data-i="${i}">Tirar</button></span></li>`));
  return lin.length ? `<ul class="vd-itens">${lin.join("")}</ul>` : `<div class="muted" style="padding:.4rem 0">Nenhum arquivo anexado.</div>`;
}
function blocoAnexo(v) {
  if (VD.semAnx) return `<div class="bloco" id="vd-anx"><h3>Orçamento do software</h3><div class="muted">O banco ainda não recebeu a atualização 14. Rode o arquivo <b>kanban_atualizacao_14.sql</b> no Supabase para anexar o arquivo do orçamento e registrar valor e condições.</div></div>`;
  const ed = anxEditavel(v), dis = ed ? "" : " disabled", c = v || {};
  return `<div class="bloco" id="vd-anx"><h3>Orçamento do software (arquivo e condições)</h3>
    <p class="muted" style="margin:0 0 .5rem;font-size:.9rem">Guarde aqui o orçamento feito no software. Se for PDF, o app lê o valor total e as condições e preenche os campos: confira sempre. O arquivo fica só neste ${v && v.numero_pedido ? "pedido" : "registro"}; o card do Financeiro leva as condições e o link do pedido.</p>
    <div id="vd-anx-lista">${listaAnexosHtml(v)}</div>
    ${ed ? `<div class="field"><label for="vd-arq">Anexar arquivo (PDF, imagem ou planilha, até 20 MB)</label><input id="vd-arq" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.xls,.xlsx,.csv,.doc,.docx" multiple></div>` : ""}
    <div id="vd-anx-msg" class="muted" role="status" style="margin-bottom:.5rem"></div>

    <div class="grade3"><div class="field"><label for="vd-c-num">Nº no software</label><input id="vd-c-num" type="text" maxlength="60" value="${esc(c.orc_numero_ext || "")}" autocomplete="off"${dis}></div>
      <div class="field"><label for="vd-c-total">Valor total do orçamento (R$)</label><input id="vd-c-total" type="text" inputmode="decimal" maxlength="20" value="${esc(valorTxt(c.orc_total === undefined || c.orc_total === null ? null : Number(c.orc_total)))}" placeholder="Ex.: 18.500,50" autocomplete="off"${dis}></div>
      <div class="field"><label for="vd-c-entrada">Entrada (R$)</label><input id="vd-c-entrada" type="text" inputmode="decimal" maxlength="20" value="${esc(valorTxt(c.orc_entrada === undefined || c.orc_entrada === null ? null : Number(c.orc_entrada)))}" autocomplete="off"${dis}></div></div>
    <div id="vd-c-compara" class="muted" style="font-size:.88rem;margin:-.2rem 0 .5rem"></div>
    <div class="field"><label for="vd-c-pag">Forma de pagamento</label><input id="vd-c-pag" type="text" maxlength="300" value="${esc(c.orc_pagamento || "")}" placeholder="Ex.: 50% de entrada + 3x no boleto" autocomplete="off"${dis}></div>
    <div class="grade2"><div class="field"><label for="vd-c-prazo">Prazo de entrega</label><input id="vd-c-prazo" type="text" maxlength="300" value="${esc(c.orc_prazo || "")}" autocomplete="off"${dis}></div>
      <div class="field"><label for="vd-c-val">Validade da proposta</label><input id="vd-c-val" type="text" maxlength="100" value="${esc(c.orc_validade || "")}" autocomplete="off"${dis}></div></div>
    <div class="field"><label for="vd-c-obs">Observações das condições</label><textarea id="vd-c-obs" rows="2" maxlength="2000"${dis}>${esc(c.orc_obs || "")}</textarea></div>
    ${ed ? (v ? `<div class="erro-campo" id="e-anx" role="alert"></div><button type="button" data-acao="vd-anx-salvar">Salvar arquivo e condições</button>` : `<div class="muted" style="font-size:.88rem">Será salvo junto com o orçamento.</div>`) : ""}</div>`;
}
function redesenharAnexos() { const l = $("#vd-anx-lista"); if (l) l.innerHTML = listaAnexosHtml(VE.id ? VD.vendas.find(x => x.id === VE.id) : null); }
function ligarAnexo() { atualizarComparaItens(); }
function escolherArquivos(inp) {
  const msg = $("#vd-anx-msg"), erros = [], novos = [];
  [...inp.files].forEach(f => {
    if (!EXT_ANEXO.includes(extDe(f.name))) erros.push(`${f.name}: tipo não aceito (use PDF, imagem ou planilha)`);
    else if (f.size > MAX_ANEXO) erros.push(`${f.name}: maior que 20 MB`);
    else if (f.size === 0) erros.push(`${f.name}: arquivo vazio`);
    else novos.push(f);
  });
  inp.value = "";
  VE.pend = (VE.pend || []).concat(novos);
  redesenharAnexos();
  if (msg) msg.textContent = erros.join(" · ");
  const pdf = novos.find(f => extDe(f.name) === "pdf");
  if (pdf) lerPdfEPreencher(pdf, false);
  else if (novos.length && msg && !erros.length) msg.textContent = "Arquivo anexado. A leitura automática só funciona em PDF: digite o valor e as condições.";
}
async function gravarAnexosECondicoes(id) {
  const falhas = [];
  for (const f of (VE.pend || []).slice()) {
    try {
      const cam = `${id}/${crypto.randomUUID()}-${nomeSeguro(f.name)}`;
      await Api.bin(`/storage/v1/object/vendas-anexos/${caminhoStorage(cam)}`, { metodo: "POST", corpo: f, tipo: f.type || "application/octet-stream" });
      await Api.rpc("registrar_anexo_venda", { p_venda: id, p_nome: f.name, p_caminho: cam, p_mime: f.type || null, p_bytes: f.size });
      VE.pend = VE.pend.filter(x => x !== f);
    } catch (e) { falhas.push(`${f.name}: ${msgVenda(e)}`); }
  }
  if ($("#vd-c-total")) {
    const c = lerCondicoes();
    try { await Api.rpc("salvar_condicoes_venda", { p_id: id, p_numero_ext: c.num || null, p_total: c.total, p_entrada: c.entrada, p_pagamento: c.pag || null, p_prazo: c.prazo || null, p_validade: c.val || null, p_obs: c.obs || null }); VE.condSuja = false; }
    catch (e) { falhas.push("condições: " + msgVenda(e)); }
  }
  return falhas;
}
async function salvarAnexoCond() {
  const er = $("#e-anx") || $("#e-venda"), bt = $('[data-acao="vd-anx-salvar"]');
  er.textContent = "";
  const e0 = validarCondicoes(); if (e0) { er.textContent = e0; return false; }
  if (bt) bt.disabled = true;
  const falhas = await gravarAnexosECondicoes(VE.id);
  try { await carregarVendas(); } catch (e) { /* mostra o que deu */ }
  const v = VD.vendas.find(x => x.id === VE.id); if (v && !VE.leitura) VE.versao = v.versao;
  redesenharAnexos(); if (bt) bt.disabled = false;
  if (falhas.length) { er.textContent = "Não salvou tudo: " + falhas.join(" | "); return false; }
  aviso("Arquivo e condições salvos."); VE.condSuja = false;
  return true;
}
async function abrirAnexo(id) {
  const a = VD.anexos.find(x => x.id === id); if (!a) return;
  const nova = window.open("", "_blank");
  try {
    const blob = await Api.bin(`/storage/v1/object/authenticated/vendas-anexos/${caminhoStorage(a.caminho)}`);
    const url = URL.createObjectURL(blob.type ? blob : new Blob([blob], { type: a.tipo_mime || "application/octet-stream" }));
    if (nova && /^(application\/pdf|image\/)/.test(a.tipo_mime || "")) nova.location.href = url;
    else { if (nova) nova.close(); const l = document.createElement("a"); l.href = url; l.download = a.nome; document.body.appendChild(l); l.click(); l.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (e) { if (nova) nova.close(); aviso(msgVenda(e), "erro"); }
}
async function tirarAnexo(id) {
  const a = VD.anexos.find(x => x.id === id); if (!a) return;
  if (!(await confirmar(`Tirar o arquivo “${a.nome}” deste registro? Ele deixa de aparecer aqui (fica guardado no servidor).`, "Tirar arquivo"))) return;
  try { await Api.rpc("remover_anexo_venda", { p_anexo: id }); await carregarVendas(); redesenharAnexos(); aviso("Arquivo retirado."); } catch (e) { aviso(msgVenda(e), "erro"); }
}
const valorVendaTxt = v => v.orc_total !== null && v.orc_total !== undefined ? `<b>${esc(brl(v.orc_total))}</b><span class="muted" style="display:block;font-size:.8rem">orçamento do software</span>` : valorTotalTxt(itensDaVenda(v.id));
const clipeTxt = v => { const n = anexosDaVenda(v.id).length; return n ? ` <span class="muted" title="${pl(n, "arquivo anexado", "arquivos anexados")}" aria-label="${pl(n, "arquivo anexado", "arquivos anexados")}">📎${n}</span>` : ""; };
const verPedidoBtn = c => { const m = podeVerVendas() && String(c.descricao || "").match(/#\/vendas\?pedido=([0-9a-f-]{36})/); return m ? `<button type="button" class="small" data-acao="vd-ver-pedido" data-id="${m[1]}">Ver pedido</button>` : ""; };
