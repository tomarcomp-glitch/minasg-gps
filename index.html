  --accent:#1f5f8b; --accent-text:#ffffff; --accent-soft:#e2eef6;

button,.btn{font:inherit;padding:.45rem .85rem;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;min-height:40px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}

.erro-campo{color:var(--danger);font-size:.85rem;min-height:1.1em}
.vazio{padding:2rem 1rem;text-align:center;color:var(--muted)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:.4rem .9rem;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);min-width:120px}

.t-pagar{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.t-receber{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.t-alerta{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.t-perigo{background:var(--danger-soft);border-color:transparent;color:var(--danger)}

td.n,th.n{text-align:right}
.barra-lote{position:sticky;top:0;z-index:3;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:.5rem .75rem;margin-bottom:.75rem}

.rodape-dialogo{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grade3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}

.sr{position:absolute;left:-9999px}
@media (pointer:coarse){.kcard{touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}

body.arrastando-cartao{overscroll-behavior:none}
.ag-barra{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ag-dia{margin-bottom:.9rem}

.ag-hora{font-variant-numeric:tabular-nums;font-weight:600;padding:.55rem .3rem;color:var(--accent)}
.ag-item.feito .t{text-decoration:line-through;color:var(--muted)}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.mes .cab-d{background:var(--surface);padding:.3rem;text-align:center;font-size:.8rem;color:var(--muted)}
.mes .cel{background:var(--surface);min-height:104px;padding:.2rem;overflow:hidden}

.mes .chip-ag.feito{opacity:.55;text-decoration:line-through}
.mes .mais{font-size:.72rem;color:var(--muted);padding-left:4px}
.mes .conta{display:none;margin-left:.2rem;padding:0 .4rem;border-radius:99px;background:var(--accent);color:var(--accent-text);font-size:.75rem;font-weight:600}
.filtros-det>summary{cursor:pointer;font-weight:600;padding:.5rem .2rem;min-height:40px;margin-bottom:.4rem}
.filtros-det[open]>summary{margin-bottom:.2rem}
.campo-lin{display:grid;grid-template-columns:1.4fr 150px 1.6fr auto;gap:.4rem;align-items:center;margin-bottom:.45rem}
@media (max-width:820px){
  .kanban{grid-template-columns:repeat(4,80vw)}
  .kanban.com-arq{grid-template-columns:repeat(5,80vw)}
  .campo-lin{grid-template-columns:1fr;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
  .ag-item{grid-template-columns:78px 1fr}
  .mes .cel{min-height:62px}.mes .chip-ag,.mes .mais{display:none}.mes .conta{display:inline-block}
}
@media (max-width:820px){

  .grade2,.grade3{grid-template-columns:1fr}
  .linha{grid-template-columns:auto 1fr auto}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,button,#avisos,.filtros{display:none!important}.app{display:block}body{background:#fff;color:#000}}
</style>

const Api = (() => {
  const K = CFG.pref + "sessao";
  let somenteLeitura = false;
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(K) || "null"); } catch (e) { sess = null; }
  const guardarSess = s => { sess = s; try { s ? localStorage.setItem(K, JSON.stringify(s)) : localStorage.removeItem(K); } catch (e) { /* ok */ } };
  const aPartirDe = d => guardarSess({ token: d.access_token, refresh: d.refresh_token, expira: Date.now() + (d.expires_in || 3600) * 1000, uid: (d.user && d.user.id) || (sess && sess.uid) });
  function msgErro(j, status) {
    let m = j && (j.message || j.msg || j.error_description || j.error);
    if (!m) return "Erro " + status;
    if (/row-level security|permission denied/i.test(m)) return "Você não tem permissão para esta ação.";
    if (/(column|schema cache)/i.test(m) && /(hora_prevista|hora_fim|campos|usa_financeiro|ordem|ativo)/i.test(m)) return "O banco ainda não recebeu a atualização 1. Rode o arquivo kanban_atualizacao_1.sql no Supabase.";
    if (/duplicate key/i.test(m)) return "Já existe um registro igual.";
    if (/JWT expired|invalid JWT/i.test(m)) return "Sessão expirada. Entre de novo.";
    return m;
  }
  const qs = p => Object.entries(p || {}).filter(([, v]) => v !== undefined).map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");

  async function renovar() {
    if (!sess || !sess.refresh) { guardarSess(null); throw new Error("Sessão expirada. Entre de novo."); }
    try {
      const r = await chamar("/auth/v1/token?grant_type=refresh_token", { metodo: "POST", corpo: { refresh_token: sess.refresh }, semToken: true }, false);
      aPartirDe(r.dados);
    } catch (e) {
      if (e.status && e.status < 500) { guardarSess(null); throw new Error("Sessão expirada. Entre de novo."); }
      throw e;
    }
  }
  async function chamar(caminho, { metodo = "GET", corpo, cab = {}, semToken = false } = {}, repetir = true) {
    if (somenteLeitura && metodo !== "GET" && !/^\/auth\/v1\/(token|logout)/.test(caminho)) throw new Error("Modo Ver como: só visualização. Volte ao modo administrador para fazer alterações.");
    const h = { apikey: CFG.chave, ...cab };
    if (corpo !== undefined) h["Content-Type"] = "application/json";
    if (!semToken && sess) {
      if (sess.expira - Date.now() < 60000 && repetir) await renovar();
      if (sess) h.Authorization = "Bearer " + sess.token;
    }
    let r;
    try { r = await fetch(CFG.url + caminho, { method: metodo, headers: h, body: corpo !== undefined ? JSON.stringify(corpo) : undefined }); }
    catch (e) { throw new Error("Sem conexão com o servidor. Verifique a internet e tente de novo."); }
    if (r.status === 401 && !semToken && sess && repetir) { await renovar(); return chamar(caminho, { metodo, corpo, cab, semToken }, false); }
    const txt = await r.text();
    let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
    if (!r.ok) { const e = new Error(msgErro(j, r.status)); e.status = r.status; throw e; }
    return { dados: j };
  }
  const ler = async (t, p) => (await chamar(`/rest/v1/${t}?${qs(p)}`)).dados || [];
  async function listar(t, p) {
    let tudo = [], desde = 0;
    for (;;) {
      const pag = (await chamar(`/rest/v1/${t}?${qs({ ...p, limit: 1000, offset: desde })}`)).dados || [];
      tudo = tudo.concat(pag);
      if (pag.length < 1000) break;
      desde += 1000;
    }
    return tudo;
  }
  return {
    get logado() { return !!sess; },
    get uid() { return sess && sess.uid; },
    set somenteLeitura(v) { somenteLeitura = !!v; },
    ler, listar,
    inserir: async (t, corpo, query, prefer = "return=representation") => (await chamar(`/rest/v1/${t}${query ? "?" + qs(query) : ""}`, { metodo: "POST", corpo, cab: { Prefer: prefer } })).dados,
    alterar: async (t, filtros, corpo) => (await chamar(`/rest/v1/${t}?${qs(filtros)}`, { metodo: "PATCH", corpo, cab: { Prefer: "return=representation" } })).dados || [],
    apagar: async (t, filtros) => (await chamar(`/rest/v1/${t}?${qs(filtros)}`, { metodo: "DELETE", cab: { Prefer: "return=representation" } })).dados || [],
    rpc: async (nome, args) => (await chamar(`/rest/v1/rpc/${nome}`, { metodo: "POST", corpo: args || {} })).dados,
    async entrar(usuario, senha) {
      const email = String(usuario).trim().toLowerCase() + "@" + CFG.dominio;
      try { aPartirDe((await chamar("/auth/v1/token?grant_type=password", { metodo: "POST", corpo: { email, password: senha }, semToken: true }, false)).dados); }
      catch (e) { if (e.status && e.status >= 400 && e.status < 500) throw new Error("Usuário ou senha incorretos."); throw e; }
    },
    async sair() { try { if (sess) await chamar("/auth/v1/logout", { metodo: "POST" }, false); } catch (e) { /* sai mesmo assim */ } guardarSess(null); },
    limpar() { guardarSess(null); },
    trocarSenha: senha => chamar("/auth/v1/user", { metodo: "PUT", corpo: { password: senha } }),
    funcao: async (nome, corpo) => (await chamar("/functions/v1/" + nome, { metodo: "POST", corpo })).dados
  };
})();

function passa(c, f, hoje) {
  if (!f.arquivados && c.arquivado) return false;
  if (f.status === "abertos" && c.status === "concluido") return false;
  if (f.status === "concluidos" && c.status !== "concluido") return false;
  if (f.tipo && (areaDe(c.quadro_id) || {}).usa_financeiro && c.tipo !== f.tipo) return false;
  if (f.categoria === "__sem") { if (c.categoria_id) return false; }
  else if (f.categoria && categoriasArea(c.quadro_id).some(x => x.id === f.categoria) && c.categoria_id !== f.categoria) return false;
  if (f.resp && !(S.resp.get(c.id) || []).includes(f.resp === "__eu" ? uidEf() : f.resp)) return false;
  if (f.busca && !((c.titulo + " " + (c.empresa || "")).toLowerCase().includes(f.busca.toLowerCase()))) return false;
  const d = c[f.campo];
  switch (f.periodo) {
    case "hoje": return d === hoje;
    case "semana": return !!d && d >= inicioSemana(hoje) && d <= fimSemana(hoje);
    case "mes": return !!d && d >= inicioMes(hoje) && d <= fimMes(hoje);
    case "atrasados": return ehAtrasado(c, hoje);
    case "semdata": return !d;
    case "periodo": return !!d && (!f.de || d >= f.de) && (!f.ate || d <= f.ate);
    default: return true;
  }
}
function contadores(f, hoje) {
  const ab = cartoesArea().filter(c => !c.arquivado && c.status !== "concluido");
  return {
    atrasados: ab.filter(c => ehAtrasado(c, hoje)).length,
    hoje: ab.filter(c => c[f.campo] === hoje).length,
    semana: ab.filter(c => c[f.campo] && c[f.campo] >= inicioSemana(hoje) && c[f.campo] <= fimSemana(hoje)).length,
    semdata: ab.filter(c => !c[f.campo]).length
  };
}
const porData = campo => (a, b) => {
  const x = a[campo] || "9999-99-99", y = b[campo] || "9999-99-99";
  return x < y ? -1 : x > y ? 1 : a.titulo.localeCompare(b.titulo, "pt-BR");
};
function somas(lista) {
  let p = 0, r = 0;
  lista.forEach(c => { if (c.valor == null) return; if (c.tipo === "receber") r += cent(c.valor); else if (c.tipo !== "tarefa") p += cent(c.valor); });
  return { pagar: p / 100, receber: r / 100 };
}
function relativo(c, hoje) {
  if (c.status === "concluido" || !c.data_prevista) return "";
  const d = diasEntre(hoje, c.data_prevista);
  if (d < 0) return `atrasado há ${-d} ${d === -1 ? "dia" : "dias"}`;
  if (d === 0) return "vence hoje";
  if (d === 1) return "vence amanhã";
  return `faltam ${d} dias`;
}

async function desarquivarCartao(id) {
  const c = cartaoLocal(id); if (!c) return;
  if (!podeEditar(c.quadro_id)) { aviso("Você só pode ler esta área.", "erro"); return; }
  try {
    const r = await Api.alterar("cartoes", { id: "eq." + id, versao: "eq." + c.versao }, { arquivado: false });
    if (!r.length) { aviso("Outro usuário alterou este cartão. Atualizei a tela, tente de novo.", "erro"); await carregarQuadro(); }
    else { mesclar(r[0]); aviso("Cartão desarquivado. Voltou para \"" + STATUS[r[0].status] + "\"."); }
    render();
  } catch (e) { erro(e); }
}

const FA = { modo: "semana", ref: "", area: "", resp: "", concl: true, ...pref.ler("agenda", {}) };

const dataLonga = iso => `${DIAS[dowIso(iso)]}, ${dataBR(iso)}`;
function ordemAgenda(a, b) {
  if (a.data_prevista !== b.data_prevista) return a.data_prevista < b.data_prevista ? -1 : 1;
  const ha = a.hora_prevista || "", hb = b.hora_prevista || "";
  if (ha !== hb) return ha < hb ? -1 : 1;
  return a.titulo.localeCompare(b.titulo, "pt-BR");
}
function itensAgenda(de, ate) {
  const alvo = FA.resp === "__eu" ? uidEf() : FA.resp;
  return S.cartoes.filter(c => !c.arquivado && c.data_prevista && c.data_prevista >= de && c.data_prevista <= ate &&
    (!FA.area || c.quadro_id === FA.area) && (FA.concl || c.status !== "concluido") &&
    (!alvo || (S.resp.get(c.id) || []).includes(alvo))).sort(ordemAgenda);
}
function itemAgenda(c, hoje) {
  const feito = c.status === "concluido", atras = ehAtrasado(c, hoje);
  const meta = [(areaDe(c.quadro_id) || {}).nome, ...destaques(c), respTxt(c), STATUS[c.status]].filter(Boolean).map(esc).join(" · ");
  return `<div class="ag-item${feito ? " feito" : ""}${atras ? " atras" : ""}"><span class="ag-hora">${faixaHora(c) || "Dia todo"}</span>

}

  render();
}

    try {
      await Api.inserir("quadros", { chave, nome, ordem, usa_financeiro: $("#na-fin").checked }, null, "return=minimal");

  };
}
let CE = null;
const opsTxt = d => Array.isArray(d.opcoes) ? d.opcoes.join("; ") : (d.opcoes || "");
function editarCampos(qid) {
  const q = areaDe(qid); if (!q) return;
  CE = { qid, lista: JSON.parse(JSON.stringify(q.campos || [])) };
  desenharCampos();
}
function desenharCampos() {
  const n = CE.lista.length;
  const linhas = CE.lista.map((d, i) => `<div class="campo-lin">
    <input type="text" value="${esc(d.nome)}" data-cf="nome" data-i="${i}" aria-label="Nome do campo ${i + 1}" placeholder="Nome do campo">
    <select data-cf="tipo" data-i="${i}" aria-label="Tipo do campo ${i + 1}">${opt("texto", "Texto", d.tipo)}${opt("numero", "Número", d.tipo)}${opt("data", "Data", d.tipo)}${opt("lista", "Lista de opções", d.tipo)}</select>
    ${d.tipo === "lista" ? `<input type="text" value="${esc(opsTxt(d))}" data-cf="opcoes" data-i="${i}" placeholder="Opções separadas por ;" aria-label="Opções do campo ${i + 1}">` : `<span class="muted" style="font-size:.85rem">sem opções</span>`}
    <span class="seg"><button type="button" class="small" data-acao="cf-sobe" data-i="${i}" aria-label="Subir campo" ${i === 0 ? "disabled" : ""}>↑</button><button type="button" class="small" data-acao="cf-desce" data-i="${i}" aria-label="Descer campo" ${i === n - 1 ? "disabled" : ""}>↓</button><button type="button" class="small danger" data-acao="cf-remove" data-i="${i}" aria-label="Remover campo">✕</button></span></div>`).join("");
  abrir(`<h2>Campos da área: ${esc((areaDe(CE.qid) || {}).nome)}</h2>
    <p class="muted">Estes campos aparecem em todo cartão da área. Remover um campo só o esconde: o que já foi preenchido continua guardado.</p>
    ${linhas || `<div class="vazio">Nenhum campo ainda.</div>`}
    <div class="erro-campo" id="e-cf" role="alert"></div>
    <div class="rodape-dialogo"><button type="button" data-acao="cf-novo">+ Adicionar campo</button><button type="button" data-acao="fechar">Cancelar</button><button type="button" class="primary" data-acao="cf-salvar">Salvar campos</button></div>`, true);
}
function cfMover(i, d) { const j = i + d; if (j < 0 || j >= CE.lista.length) return; [CE.lista[i], CE.lista[j]] = [CE.lista[j], CE.lista[i]]; desenharCampos(); }
async function salvarCampos() {
  const usados = new Set(CE.lista.filter(d => d.id).map(d => d.id));
  const saida = [];
  for (const d of CE.lista) {
    const nome = String(d.nome || "").trim();
    if (!nome) { $("#e-cf").textContent = "Todo campo precisa de um nome."; return; }
    const item = { id: d.id, nome, tipo: d.tipo };
    if (d.tipo === "lista") {
      const ops = [...new Set(opsTxt(d).split(";").map(s => s.trim()).filter(Boolean))];
      if (!ops.length) { $("#e-cf").textContent = `O campo "${nome}" é uma lista: informe as opções separadas por ponto e vírgula.`; return; }
      item.opcoes = ops;
    }
    if (!item.id) { const base = slug(nome); let n = base, k = 2; while (usados.has(n)) n = base + "_" + k++; item.id = n; usados.add(n); }
    saida.push(item);
  }
  try {
    const r = await Api.alterar("quadros", { id: "eq." + CE.qid }, { campos: saida });
    if (!r.length) throw new Error("Não foi possível salvar.");
    await carregarAreas(); fechar(); render(); aviso("Campos salvos.");
  } catch (e) { erro(e); }
}

function abrirAcessos(id) {
  const u = S.usuarios.find(x => x.id === id); if (!u) return;
  const atual = q => { const m = (S.membrosUsr || []).find(x => x.usuario_id === id && x.quadro_id === q); return m ? m.papel : ""; };
  const adm = u.papel === "admin";
  const linhas = S.todosQuadros.map(q => {
    const v = adm ? "editor" : atual(q.id), nm = "ac-" + q.id;
    const r = (val, rot) => `<label class="inline" style="margin-right:.9rem;white-space:nowrap"><input type="radio" name="${esc(nm)}" value="${val}" ${v === val ? "checked" : ""} ${adm ? "disabled" : ""}> ${rot}</label>`;
    return `<div style="padding:.5rem 0;border-bottom:1px solid var(--line)"><div><b>${esc(q.nome)}</b>${q.ativo === false ? ' <span class="muted">(desativada)</span>' : ""}</div><div style="margin-top:.25rem">${r("editor", "Edita")}${r("leitor", "Só lê")}${r("", "Sem acesso")}</div></div>`;
  }).join("") || `<p class="muted">Nenhuma área criada.</p>`;
  abrir(`<h2>Acessos de ${esc(u.nome)}</h2>
    <p class="muted">Usuário: <b>${esc(u.usuario)}</b>. ${adm ? "Administrador acessa e edita todas as áreas." : "Marque uma opção para cada área."}</p>
    <div style="max-height:55vh;overflow:auto">${linhas}</div>
    <div class="erro-form" id="ac-erro" role="alert" style="color:var(--danger)"></div>
    <div class="rodape-dialogo"><button type="button" id="aa-cancelar">${adm ? "Fechar" : "Cancelar"}</button>${adm ? "" : `<button type="button" class="primary" id="aa-salvar">Salvar acessos</button>`}</div>`);
  $("#aa-cancelar").onclick = fechar;
  const sv = $("#aa-salvar"); if (!sv) return;
  sv.onclick = async () => {
    sv.disabled = true; sv.textContent = "Salvando...";
    try {
      for (const q of S.todosQuadros) {
        const sel = document.querySelector(`input[name="ac-${q.id}"]:checked`), novo = sel ? sel.value : "", ant = atual(q.id);
        if (novo === ant) continue;
        if (!novo) await Api.apagar("quadro_membros", { quadro_id: "eq." + q.id, usuario_id: "eq." + id });
        else await Api.inserir("quadro_membros", { quadro_id: q.id, usuario_id: id, papel: novo }, { on_conflict: "quadro_id,usuario_id" }, "resolution=merge-duplicates,return=minimal");
      }
      fechar(); aviso("Acessos salvos."); render();
    } catch (e) { $("#ac-erro").textContent = e.message; sv.disabled = false; sv.textContent = "Salvar acessos"; }
  };
}

async function verComo(id) {
  const u = S.usuarios.find(x => x.id === id); if (!u) return;
  const m = (S.membrosUsr || []).filter(x => x.usuario_id === id);
  S.meusReal = S.meus;
  S.verComo = { id, nome: u.nome, usuario: u.usuario, papel: u.papel, ativo: u.ativo, meus: new Map(m.map(x => [x.quadro_id, x.papel])) };
  S.meus = S.verComo.meus; Api.somenteLeitura = true;
  try { await carregarAreas(); await carregarQuadro(); } catch (e) { await sairVerComo(); erro(e); return; }
  montarShell(); location.hash = "#/painel"; render();
}
async function sairVerComo() {
  S.verComo = null; if (S.meusReal) S.meus = S.meusReal; S.meusReal = null; Api.somenteLeitura = false;
  try { await carregarAreas(); await carregarQuadro(); } catch (e) { erro(e); }
  montarShell(); location.hash = "#/usuarios"; render();
}

const FUNCAO_USUARIOS = "clever-endpoint";
const ALFABETO_SENHA = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function gerarSenha(n = 10) {
  const b = new Uint32Array(n); crypto.getRandomValues(b);
  return Array.from(b, x => ALFABETO_SENHA[x % ALFABETO_SENHA.length]).join("");
}
const linkDoApp = () => location.href.split("#")[0].split("?")[0];
async function chamarFuncaoUsuarios(corpo) {
  try { return await Api.funcao(FUNCAO_USUARIOS, corpo); }
  catch (e) {
    if (e.status === 404) throw new Error("A função que cria usuários ainda não foi publicada no Supabase. Siga o passo a passo de publicação da função admin-usuarios.");
    if (e.status === 401) throw new Error("O Supabase recusou o acesso à função (401). Confira se a função admin-usuarios está publicada com \"Verify JWT\" desligado, ou entre de novo no aplicativo.");
    throw e;
  }
}
function mensagemAcesso(usuario, senha) {
  return `MINASG GPS - Gestão de Processos e Serviços\nLink: ${linkDoApp()}\nUsuário: ${usuario}\nSenha: ${senha}\nNo primeiro acesso o sistema pede para você criar uma senha nova.`;
}
async function copiarTexto(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove(); return ok;
  }
}
function mostrarAcesso(titulo, usuario, senha) {
  const msg = mensagemAcesso(usuario, senha);
  abrir2(`<h2>${esc(titulo)}</h2>

async function moverLote(ids) {
  const alvos = S.todosQuadros.filter(q => q.ativo !== false && q.id !== S.quadroId);
  if (!alvos.length) { aviso("Não há outra área para receber os cartões.", "erro"); return; }
  const destino = await new Promise(res => {
    let feito = false; const fim = v => { if (feito) return; feito = true; fechar2(); res(v); };
    abrir2(`<h2>Mover ${esc(pl(ids.length, "cartão", "cartões"))} para outra área</h2>
      <div class="field"><label for="ml-area">Área de destino</label><select id="ml-area">${alvos.map(q => `<option value="${esc(q.id)}">${esc(q.nome)}</option>`).join("")}</select></div>
      <p class="muted">As etiquetas saem e a categoria só fica se existir uma com o mesmo nome na área nova. Responsáveis, datas e histórico continuam. Quem não tem acesso à área nova não verá os cartões.</p>
      <div class="rodape-dialogo"><button type="button" id="ml-nao">Cancelar</button><button type="button" class="primary" id="ml-sim">Mover</button></div>`);
    $("#ml-nao").onclick = () => fim(null); $("#ml-sim").onclick = () => fim($("#ml-area").value); dlg2.oncancel = () => fim(null);
  });
  if (!destino) return;
  const semAcesso = new Set();
  ids.forEach(id => (S.resp.get(id) || []).forEach(u => { if (!temAcessoArea(u, destino)) semAcesso.add(u); }));

function linhasImportacao(d, ctx) {

async function importarAgora() {
  const d = IMP.dados; if (!d) return;
  if (!(await confirmar(`Importar ${(d.cartoes || []).length} cartões financeiros e ${(d.documentos || []).length} documentos? Cartões que já foram importados são ignorados.`, "Importar", false))) return;
  const log = t => { IMP.relatorio += t + "\n"; const el = $("#imp-log"); if (el) el.textContent = IMP.relatorio; };
  IMP.relatorio = "";
  const btn = $('[data-acao="importar-agora"]'); if (btn) btn.disabled = true;
  try {
    const quadroFin = S.todosQuadros.find(q => q.chave === "financeiro").id, quadroDoc = S.todosQuadros.find(q => q.chave === "documentacao").id;
    log("Criando categorias e etiquetas...");
    const cats = (((d.quadros || []).find(q => q.chave === "financeiro") || {}).categorias || []).map(c => ({ quadro_id: quadroFin, nome: c.nome }));
    cats.push({ quadro_id: quadroDoc, nome: "Gestão de processos" });
    if (cats.length) await Api.inserir("categorias", cats, { on_conflict: "quadro_id,nome" }, "resolution=ignore-duplicates,return=minimal");
    const etqs = (d.etiquetas || []).map(e => ({ quadro_id: quadroFin, cor: e.cor, nome: e.nome }));
    if (etqs.length) await Api.inserir("etiquetas", etqs, { on_conflict: "quadro_id,cor" }, "resolution=ignore-duplicates,return=minimal");
    const catRows = await Api.ler("categorias", { select: "id,nome,quadro_id" });
    const catPorNome = new Map(catRows.map(c => [c.nome, c.id]));
    const etqRows = await Api.ler("etiquetas", { select: "id,cor", quadro_id: "eq." + quadroFin });
    const etqPorCor = new Map(etqRows.map(e => [e.cor, e.id]));
    const linhas = linhasImportacao(d, { quadroFin, quadroDoc, catPorNome });
    let novos = 0, ignorados = 0;
    for (let i = 0; i < linhas.length; i += 40) {
      const lote = linhas.slice(i, i + 40);
      const corpo = lote.map(l => { const { _extra, ...r } = l; return r; });
      const ret = await Api.inserir("cartoes", corpo, { on_conflict: "id_externo", select: "id,id_externo" }, "resolution=ignore-duplicates,return=representation");
      const idPor = new Map((ret || []).map(r => [r.id_externo, r.id]));
      novos += idPor.size; ignorados += lote.length - idPor.size;
      const hist = [], resp = [], etq = [];
      lote.forEach(l => {
        const id = idPor.get(l.id_externo); if (!id) return;
        if (l._extra.data_prevista) hist.push({ cartao_id: id, campo: "data_prevista", data_anterior: null, data_nova: l._extra.data_prevista, motivo: "Importado do Trello", origem: "importacao", alterado_por: Api.uid });
        if (l._extra.data_inicio) hist.push({ cartao_id: id, campo: "data_inicio", data_anterior: null, data_nova: l._extra.data_inicio, motivo: "Importado do Trello", origem: "importacao", alterado_por: Api.uid });
        l._extra.responsaveis.forEach(u => resp.push({ cartao_id: id, usuario_id: u }));
        l._extra.etiquetas.forEach(cor => { if (etqPorCor.has(cor)) etq.push({ cartao_id: id, etiqueta_id: etqPorCor.get(cor) }); });
      });
      if (hist.length) await Api.inserir("historico_datas", hist, null, "return=minimal");
      if (resp.length) await Api.inserir("cartao_responsaveis", resp, null, "return=minimal");
      if (etq.length) await Api.inserir("cartao_etiquetas", etq, null, "return=minimal");
      log(`${Math.min(i + 40, linhas.length)} de ${linhas.length} processados...`);
    }
    log(`Pronto: ${novos} cartões novos, ${ignorados} já existiam e foram mantidos.`);
    await carregarQuadro();
    aviso("Importação concluída.");
  } catch (e) { log("PAROU COM ERRO: " + e.message + "\nCorrija e rode de novo: o que já entrou não duplica."); erro(e); }
  if (btn) btn.disabled = false;
}

function lerFormulario() {
  const c = CA.c, fin = !!(areaDe(c.quadro_id) || {}).usa_financeiro;
  ["#e-titulo", "#e-valor", "#e-campos", "#e-hora"].forEach(s => { const el = $(s); if (el) el.textContent = ""; });

  if (!titulo) { $("#e-titulo").textContent = "Escreva o título do cartão."; ok = false; }
  let valor = null;
  if (fin) { valor = lerValor($("#f-valor").value); if (Number.isNaN(valor)) { $("#e-valor").textContent = "Valor inválido. Use o formato 1.234,56."; ok = false; } }
  const hi = $("#f-hini").value || null, hf = $("#f-hfim").value || null;
  if (hi && hf && hf < hi) { $("#e-hora").textContent = "A hora de término não pode ser antes da hora de início."; ok = false; }
  const campos = { ...(c.campos || {}) };
  camposDe(c.quadro_id).forEach(d => {
    const el = $$("[data-cp]", dlg).find(x => x.dataset.cp === d.id); if (!el) return;
    const v = el.value.trim();
    if (!v) { delete campos[d.id]; return; }
    if (d.tipo === "numero") {
      const n = lerValor(v);
      if (Number.isNaN(n)) { $("#e-campos").textContent = `"${d.nome}": digite um número, por exemplo 12 ou 12,5.`; ok = false; } else campos[d.id] = n;
    } else campos[d.id] = v;
  });
  if (!ok) return null;
  const out = {
    titulo, descricao: $("#f-desc").value.trim() || null, status: $("#f-status").value,
    categoria_id: ($("#f-cat") ? $("#f-cat").value : c.categoria_id) || null,
    conferido: $("#f-conf") ? $("#f-conf").checked : c.conferido,
    hora_prevista: hi, hora_fim: hf, campos,
    resp: [...new Set($$("[data-resp]", dlg).filter(x => x.checked).map(x => x.dataset.resp))],
    etq: $$("[data-etq]", dlg).filter(x => x.checked).slice(0, 1).map(x => x.dataset.etq)
  };
  if (fin) { out.tipo = $("#f-tipo").value || null; out.valor = valor; out.empresa = $("#f-empresa").value.trim() || null; }
  return out;
}
async function sincronizarLigacoes(cartaoId, tabela, campo, antes, depois) {

  if (novos.length) await Api.inserir(tabela, novos.map(x => ({ cartao_id: cartaoId, [campo]: x })), null, "return=minimal");
  for (const x of fora) await Api.apagar(tabela, { cartao_id: "eq." + cartaoId, [campo]: "eq." + x });
}

    const msg = sem.length ? `${sem.join(", ")} ${sem.length === 1 ? "não tem" : "não têm"} acesso à área "${nomeDest}" e não ${sem.length === 1 ? "verá" : "verão"} este cartão. Libere em Usuários > Acessos. Mover mesmo assim?` : `Mover este cartão para a área "${nomeDest}"?`;

      await sincronizarLigacoes(novo.id, "cartao_responsaveis", "usuario_id", [], resp);

async function moverCartao(id, status) {

      const r = await Api.alterar("quadros", { id: "eq." + id }, { [campo]: valor });
      if (!r.length) throw new Error("Não foi possível salvar.");
      await carregarAreas(); montarShell(); await carregarQuadro(); render(); aviso("Área atualizada.");
    } catch (e) { erro(e); render(); }
    return;
  }
  if (t.dataset && t.dataset.filtro && t.dataset.grupo && t.type !== "search") {
    F[t.dataset.grupo][t.dataset.filtro] = t.type === "checkbox" ? t.checked : t.value; salvarFiltros(); render(); return;
  }
  if (t.dataset && t.dataset.fc) { FC[t.dataset.fc] = t.value; render(); return; }
  if (t.dataset && "sel" in t.dataset) { if (t.checked) FC.sel.add(t.dataset.sel); else FC.sel.delete(t.dataset.sel); render(); return; }
  if (t.hasAttribute && t.hasAttribute("data-sel-todos")) {
    $$("[data-sel]").forEach(x => { if (t.checked) FC.sel.add(x.dataset.sel); else FC.sel.delete(x.dataset.sel); }); render(); return;
  }
  if (t.dataset && "lsel" in t.dataset) { t.checked ? FL.sel.add(t.dataset.lsel) : FL.sel.delete(t.dataset.lsel); atualizarBarraLixeira(); return; }
  if (t.hasAttribute && t.hasAttribute("data-lsel-todos")) { $$("[data-lsel]").forEach(x => { x.checked = t.checked; t.checked ? FL.sel.add(x.dataset.lsel) : FL.sel.delete(x.dataset.lsel); }); atualizarBarraLixeira(); return; }
  if (t.id === "imp-arq" && t.files[0]) {
    try { const d = JSON.parse(await t.files[0].text()); if (!Array.isArray(d.cartoes)) throw new Error("x"); IMP.dados = d; IMP.relatorio = ""; render(); }
    catch (e) { aviso("Arquivo inválido. Escolha o JSON de importação gerado para este sistema.", "erro"); }
    return;
  }
  if (t.dataset && t.dataset.u) {
    const id = t.dataset.id, campo = t.dataset.u;
    const valor = t.type === "checkbox" ? t.checked : t.value.trim();
    if (campo === "nome" && !valor) { aviso("O nome não pode ficar vazio.", "erro"); render(); return; }
    try {
      if (campo === "ativo" && !valor && !(await confirmar("Desativar este usuário? Ele perde o acesso na hora. O histórico dele continua guardado.", "Desativar"))) { render(); return; }
      const r = await Api.alterar("profiles", { id: "eq." + id }, { [campo]: valor });
      if (!r.length) throw new Error("Não foi possível salvar.");
      aviso("Usuário atualizado."); if (id === Api.uid) S.eu = { ...S.eu, ...r[0] };
    } catch (e) { erro(e); render(); }
    return;
  }
  if (t.dataset && t.dataset.um) {
    const qid = t.dataset.um, uid = t.dataset.id;
    try {
      if (!t.value) await Api.apagar("quadro_membros", { quadro_id: "eq." + qid, usuario_id: "eq." + uid });
      else await Api.inserir("quadro_membros", { quadro_id: qid, usuario_id: uid, papel: t.value }, { on_conflict: "quadro_id,usuario_id" }, "resolution=merge-duplicates,return=minimal");
      aviso("Acesso atualizado.");
    } catch (e) { erro(e); render(); }
  }
});
function atualizarBarraLixeira() {
  const n = FL.sel.size, el = $("#lx-n"); if (el) el.textContent = `${n} selecionado${n === 1 ? "" : "s"}`;
  ["#lx-r", "#lx-e"].forEach(s => { const b = $(s); if (b) b.disabled = n === 0; });
}
let tBusca = null;
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.cf && t.dataset.cf !== "tipo" && CE) { CE.lista[Number(t.dataset.i)][t.dataset.cf] = t.value; return; }
  if (t.dataset && t.dataset.filtro === "busca") { F[t.dataset.grupo].busca = t.value; salvarFiltros(); clearTimeout(tBusca); tBusca = setTimeout(render, 250); }
  else if (t.dataset && t.dataset.fc === "busca") { FC.busca = t.value; clearTimeout(tBusca); tBusca = setTimeout(render, 250); }
});

/* ===== arrastar cartões: mouse (arrastar) e celular (segurar e arrastar) ===== */
const Drag = { mouse: false, timer: null, ativo: false, id: null, ghost: null, alvo: null, x0: 0, y0: 0, x: 0, y: 0, dx: 0, dy: 0, raf: null, bloqueiaClique: 0 };
const STATUS_BARRA = ["a_fazer", "em_andamento", "concluido"];
const alvoSob = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest(".kcol, .dropbtn") : null; };
function marcarAlvo(el) {
  if (Drag.alvo === el) return;
  if (Drag.alvo) Drag.alvo.classList.remove("sobre");
  Drag.alvo = el; if (el) el.classList.add("sobre");
}
function iniciarArraste(card, x, y) {
  Drag.ativo = true; Drag.id = card.dataset.id;
  const r = card.getBoundingClientRect();
  const g = card.cloneNode(true);
  g.classList.add("ghost"); g.removeAttribute("draggable"); g.style.width = r.width + "px";
  Drag.dx = x - r.left; Drag.dy = y - r.top;
  document.body.appendChild(g); Drag.ghost = g;
  card.classList.add("arrastando");
  const barra = document.createElement("div");
  barra.className = "dropbar"; barra.id = "dropbar"; barra.setAttribute("aria-hidden", "true");
  barra.innerHTML = [...STATUS_BARRA, ...(document.querySelector(".kcol-arq") ? ["arquivado"] : [])].map(s => `<div class="dropbtn" data-status="${s}">${s === "arquivado" ? "Arquivados" : STATUS[s]}</div>`).join("");
  document.body.appendChild(barra);
  document.body.classList.add("arrastando-cartao");
  if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) { /* sem vibração */ } }
  moverArraste(x, y);
  Drag.raf = requestAnimationFrame(rolagemAuto);
}
function moverArraste(x, y) {
  Drag.x = x; Drag.y = y;
  Drag.ghost.style.transform = `translate(${x - Drag.dx}px, ${y - Drag.dy}px) rotate(2deg)`;
  marcarAlvo(alvoSob(x, y));
}
function rolagemAuto() {
  if (!Drag.ativo) return;
  const k = $(".kanban");
  if (k) { const r = k.getBoundingClientRect(); if (Drag.x < r.left + 48) k.scrollLeft -= 14; else if (Drag.x > r.right - 48) k.scrollLeft += 14; }
  if (Drag.y < 70) window.scrollBy(0, -14);
  Drag.raf = requestAnimationFrame(rolagemAuto);
}
function encerrarArraste(soltou) {
  clearTimeout(Drag.timer); Drag.timer = null;
  if (!Drag.ativo) return;
  cancelAnimationFrame(Drag.raf);
  const st = soltou && Drag.alvo ? Drag.alvo.dataset.status : null, id = Drag.id;
  if (Drag.ghost) Drag.ghost.remove();
  const bar = $("#dropbar"); if (bar) bar.remove();
  $$(".arrastando").forEach(x => x.classList.remove("arrastando"));
  if (Drag.alvo) Drag.alvo.classList.remove("sobre");
  document.body.classList.remove("arrastando-cartao");
  Object.assign(Drag, { ativo: false, id: null, ghost: null, alvo: null, bloqueiaClique: Date.now() + 450 });
  if (st) moverCartao(id, st);
}
document.addEventListener("touchstart", ev => {
  const card = ev.target.closest && ev.target.closest(".kcard");
  if (!card || ev.touches.length !== 1 || card.dataset.edita !== "1") return;
  const t = ev.touches[0];
  Drag.x0 = Drag.x = t.clientX; Drag.y0 = Drag.y = t.clientY;
  clearTimeout(Drag.timer);
  Drag.timer = setTimeout(() => { Drag.timer = null; iniciarArraste(card, Drag.x, Drag.y); }, 380);
}, { passive: true });
document.addEventListener("touchmove", ev => {
  const t = ev.touches[0];
  if (Drag.ativo) { ev.preventDefault(); moverArraste(t.clientX, t.clientY); return; }
  if (!Drag.timer) return;
  if (Math.hypot(t.clientX - Drag.x0, t.clientY - Drag.y0) > 10) { clearTimeout(Drag.timer); Drag.timer = null; }
  else { Drag.x = t.clientX; Drag.y = t.clientY; }
}, { passive: false });
document.addEventListener("touchend", () => encerrarArraste(true));
document.addEventListener("touchcancel", () => encerrarArraste(false));
document.addEventListener("contextmenu", ev => { if (ev.target.closest && ev.target.closest(".kcard") && matchMedia("(pointer: coarse)").matches) ev.preventDefault(); });

document.addEventListener("dragend", () => { Drag.mouse = false; });
document.addEventListener("dragstart", ev => { const k = ev.target.closest && ev.target.closest(".kcard"); if (!k) return; Drag.mouse = true; ev.dataTransfer.setData("text/plain", k.dataset.id); ev.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", ev => { const c = ev.target.closest && ev.target.closest(".kcol"); if (!c) return; ev.preventDefault(); $$(".kcol.sobre").forEach(x => { if (x !== c) x.classList.remove("sobre"); }); c.classList.add("sobre"); });
document.addEventListener("dragleave", ev => { const c = ev.target.closest && ev.target.closest(".kcol"); if (c && !c.contains(ev.relatedTarget)) c.classList.remove("sobre"); });
document.addEventListener("drop", ev => {
  const c = ev.target.closest && ev.target.closest(".kcol"); if (!c) return;
  ev.preventDefault(); c.classList.remove("sobre");
  const id = ev.dataTransfer.getData("text/plain"); if (id) moverCartao(id, c.dataset.status);
});

window.addEventListener("hashchange", render);
setInterval(async () => {
  if (!S.eu || document.hidden || dlg.open || dlg2.open || Drag.ativo || Drag.mouse) return;
  const ativo = document.activeElement && document.activeElement.tagName;
  if (["INPUT", "SELECT", "TEXTAREA"].includes(ativo)) return;
  const rota = (location.hash.replace(/^#\//, "") || "painel").split("?")[0];
  if (!["painel", "kanban", "conferir", "agenda"].includes(rota)) return;
  try { await carregarQuadro(); render(); } catch (e) { /* tenta de novo no próximo ciclo */ }
}, CFG.atualizarACada);

/* ===================== INSTALAÇÃO NO CELULAR (PWA) ===================== */
let promptInstalar = null;
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); promptInstalar = ev; });
window.addEventListener("appinstalled", () => { promptInstalar = null; const b = $('[data-acao="instalar"]'); if (b) b.remove(); });
async function instalar() {
  if (promptInstalar) {
    promptInstalar.prompt();
    try { await promptInstalar.userChoice; } catch (e) { /* o usuário fechou */ }
    promptInstalar = null; return;
  }
  abrir2(`<h2>Instalar no celular</h2>
    <p><b>Android (Chrome):</b> toque nos três pontinhos do navegador e escolha "Instalar app" ou "Adicionar à tela inicial".</p>
    <p><b>iPhone (Safari):</b> toque no botão Compartilhar e escolha "Adicionar à Tela de Início".</p>
    <p class="muted">A instalação só aparece quando o endereço começa com https (aplicativo publicado online), e não quando o arquivo é aberto direto do computador.</p>
    <div class="rodape-dialogo"><button type="button" class="primary" id="i-ok">Entendi</button></div>`);
  $("#i-ok").onclick = fechar2;
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* sem instalação offline: o app segue funcionando */ }); });
}

/* ===================== INÍCIO ===================== */
if (Api.logado) iniciar(); else telaLogin();
</script>
